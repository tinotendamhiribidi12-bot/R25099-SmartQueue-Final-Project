# SmartQueue - Spring Boot Application Properties
spring.application.name=smart-queue

# Server port
server.port=8080

# Static resources served from /static
spring.web.resources.static-locations=classpath:/static/

# Async thread pool for counters
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=counter-

# Logging
logging.level.com.queue=INFO
